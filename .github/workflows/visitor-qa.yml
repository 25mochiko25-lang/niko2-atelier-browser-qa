name: Public browser visitor QA

on:
  push:
    branches: [main]
    paths:
      - 'requests/first-time-*.json'
      - 'requests/sloppy-mobile-*.json'
      - 'requests/wanderer-*.json'
      - 'requests/outside-critic-*.json'
      - 'requests/genre-fan-*.json'
  workflow_dispatch:
    inputs:
      persona:
        description: Visitor persona
        required: true
        default: first-time
        type: choice
        options:
          - first-time
          - sloppy-mobile
          - wanderer
          - outside-critic
          - genre-fan
      target:
        description: Public NIKO² ATELIER URL
        required: true
        default: https://niko2-atelier-combined-preview.25mochiko25.workers.dev/
        type: string
      seed:
        description: Deterministic visitor seed
        required: false
        default: manual
        type: string
      maxSteps:
        description: Maximum interaction steps
        required: false
        default: '18'
        type: string

permissions:
  contents: write


jobs:
  visitor:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "persona=${{ inputs.persona }}" >> "$GITHUB_OUTPUT"
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "seed=${{ inputs.seed }}" >> "$GITHUB_OUTPUT"
            echo "maxSteps=${{ inputs.maxSteps }}" >> "$GITHUB_OUTPUT"
            echo "request=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            REQUEST="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/[^/]+\.json$' | tail -n 1 || true)"
            if [ -z "$REQUEST" ]; then
              echo "No request JSON found in triggering commit" >&2
              exit 1
            fi
            node - "$REQUEST" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const [,, file, out] = process.argv;
          const x = JSON.parse(fs.readFileSync(file, 'utf8'));
          const clean = v => String(v ?? '').replace(/[\r\n]/g, ' ').trim();
          const persona = clean(x.persona || 'first-time');
          const target = clean(x.target || 'https://niko2-atelier-combined-preview.25mochiko25.workers.dev/');
          const seed = clean(x.seed || file.replace(/^requests\//,'').replace(/\.json$/,''));
          const maxSteps = Math.max(4, Math.min(30, Number(x.maxSteps || 18)));
          fs.appendFileSync(out,
            'persona=' + persona + '\n' +
            'target=' + target + '\n' +
            'seed=' + seed + '\n' +
            'maxSteps=' + maxSteps + '\n' +
            'request=' + file.replace(/^requests\//,'').replace(/\.json$/,'') + '\n'
          );
          NODE
          fi

      - name: Install Playwright package
        run: |
          npm install --prefix /tmp/niko2-browser-qa --no-save --no-package-lock playwright@1.55.0

      - name: Run visitor
        env:
          NODE_PATH: /tmp/niko2-browser-qa/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          TARGET: ${{ steps.req.outputs.target }}
          PERSONA: ${{ steps.req.outputs.persona }}
          SEED: ${{ steps.req.outputs.seed }}
          MAX_STEPS: ${{ steps.req.outputs.maxSteps }}
          OUT: qa-output/result.json
        run: |
          set -o pipefail
          mkdir -p qa-output
          node qa/visitor.mjs | tee qa-output-summary.txt

      - name: Save compact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.req.outputs.request }}"
          DEST="results/${{ github.run_id }}-$NAME.json"
          TMP="$(mktemp)"
          if [ -f qa-output/result.json ]; then
            cp qa-output/result.json "$TMP"
          else
            printf '{"fatal":"runner produced no result","runId":"%s"}\n' "${{ github.run_id }}" > "$TMP"
          fi

          git config user.name "niko2-browser-qa"
          git config user.email "niko2-browser-qa@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results
            cp "$TMP" "$DEST"
            git add "$DEST"
            git commit -m "qa: save $NAME browser result" || exit 0
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Could not publish result after 5 attempts" >&2
          exit 1
