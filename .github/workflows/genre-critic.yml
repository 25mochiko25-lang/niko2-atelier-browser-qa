name: Public genre critic browser QA

on:
  push:
    branches: [main]
    paths:
      - 'requests/genre-critic-*.json'

permissions:
  contents: write

concurrency:
  group: public-browser-qa-writer
  cancel-in-progress: false

jobs:
  genre-critic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve genre critic request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/genre-critic-[^/]+\.json$' | tail -n 1 || true)"
          if [ -z "$REQUEST" ]; then
            echo "No genre critic request JSON found" >&2
            exit 1
          fi
          node - "$REQUEST" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('fs');
          const [,,file,out]=process.argv;
          const x=JSON.parse(fs.readFileSync(file,'utf8'));
          const clean=v=>String(v??'').replace(/[\r\n]/g,' ').trim();
          fs.appendFileSync(out,
            'target='+clean(x.target||'https://niko2-atelier-combined-preview.25mochiko25.workers.dev/')+'\n'+
            'request='+file.replace(/^requests\//,'').replace(/\.json$/,'')+'\n'
          );
          NODE

      - name: Install Playwright WebKit
        run: |
          npm install --prefix /tmp/niko2-browser-qa --no-save --no-package-lock playwright@1.55.0
          /tmp/niko2-browser-qa/node_modules/.bin/playwright install --with-deps webkit

      - name: Run genre-savvy critic
        env:
          PLAYWRIGHT_MODULE: /tmp/niko2-browser-qa/node_modules/playwright
          TARGET: \${{ steps.req.outputs.target }}
          REQUEST: \${{ steps.req.outputs.request }}
          OUTDIR: qa-output/genre-critic
        run: |
          set -o pipefail
          node qa/genre_critic.mjs | tee qa-output-genre-critic-summary.txt

      - name: Save evidence to public QA repo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          NAME="\${{ steps.req.outputs.request }}"
          DEST="results/\${{ github.run_id }}-$NAME"
          mkdir -p "$DEST"
          if [ -d qa-output/genre-critic ]; then
            cp -f qa-output/genre-critic/* "$DEST"/ 2>/dev/null || true
          fi
          if [ ! -f "$DEST/observations.json" ]; then
            printf '{"fatal":"genre critic runner produced no observations","runId":"%s"}\n' "\${{ github.run_id }}" > "$DEST/observations.json"
          fi

          git config user.name "niko2-browser-qa"
          git config user.email "niko2-browser-qa@users.noreply.github.com"
          git pull --rebase origin main
          git add "$DEST"
          git commit -m "qa: save $NAME genre critic evidence" || exit 0
          git push origin HEAD:main
