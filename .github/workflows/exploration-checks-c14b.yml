name: Visitor 3 targeted exploration checks
on:
  push:
    branches: [main]
    paths: ['requests/exploration-c14b-*.json']
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dedicated request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          REQUEST="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/exploration-c14b-[^/]+\.json$' | tail -1)"
          test -n "$REQUEST"
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$REQUEST" .json)" >> "$GITHUB_OUTPUT"
      - name: Install browser driver
        run: npm install --prefix /tmp/niko2-browser-qa --no-save --no-package-lock playwright@1.55.0
      - name: Run explicitly requested checks
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          OUT: qa-output/result.json
          REQUEST: ${{ steps.req.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p qa-output
          node qa/exploration_c14b_support.cjs prepare
          node --check /tmp/exploration-c14b.mjs
          node /tmp/exploration-c14b.mjs "$REQUEST"
      - name: Publish own evidence
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          REQUEST_NAME: ${{ steps.req.outputs.name }}
          REQUEST: ${{ steps.req.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p qa-output
          test -f qa-output/result.json || echo '{"fatal":"runner produced no result"}' > qa-output/result.json
          node qa/exploration_c14b_support.cjs digest "$REQUEST"
          TMP="$(mktemp -d)"
          cp qa-output/result.json "$TMP/result.json"
          cp qa-output/digest.md "$TMP/digest.md"
          git config user.name "niko2-browser-qa"
          git config user.email "niko2-browser-qa@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results
            cp "$TMP/result.json" "results/$RUN_ID-$REQUEST_NAME.json"
            cp "$TMP/digest.md" "results/$RUN_ID-$REQUEST_NAME-digest.md"
            git add "results/$RUN_ID-$REQUEST_NAME.json" "results/$RUN_ID-$REQUEST_NAME-digest.md"
            git commit -m "qa: save visitor 3 $REQUEST_NAME evidence" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
